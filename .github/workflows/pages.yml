name: Deploy docs to GitHub Pages

# site-docs/ (getting-started, CLI reference, Polycallfile reference, ...) is
# the primary site, built with MkDocs per mkdocs.yml and published at the
# site root. docs/ (the broader reference/knowledge base) is built with
# GitHub's default Jekyll and published alongside it under /docs/. One
# artifact, one deployment.

on:
  push:
    branches: [polycall-cli-redesign, main]
    paths:
      - "site-docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build site-docs with MkDocs -> _site/ (site_dir in mkdocs.yml)
        run: mkdocs build

      - name: Build docs/ with Jekyll -> _site/docs/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
